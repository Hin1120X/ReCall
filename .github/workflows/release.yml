name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          architecture: x64
          cache: npm
      - name: Verify release version
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -ne 'tag' -or $version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") {
            throw 'The release tag must be v followed by the exact package.json version.'
          }
          "RECALL_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run package
      - name: Verify release assets
        run: |
          $archive = "release/Recall-$env:RECALL_VERSION-Windows-x64.zip"
          $checksum = "$archive.sha256"
          if (!(Test-Path -LiteralPath $archive -PathType Leaf) -or !(Test-Path -LiteralPath $checksum -PathType Leaf)) {
            throw 'The packaged Windows x64 ZIP or its SHA-256 file is missing.'
          }
          $expected = (Get-Content -LiteralPath $checksum -Raw).Trim()
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -notmatch '^[a-f0-9]{64}$' -or $expected -cne $actual) {
            throw 'The packaged ZIP does not match its SHA-256 file.'
          }
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $archive = "release/Recall-$env:RECALL_VERSION-Windows-x64.zip"
          gh release create "$env:GITHUB_REF_NAME" "$archive" "$archive.sha256" --verify-tag --repo "$env:GITHUB_REPOSITORY" --title "Recall $env:RECALL_VERSION" --generate-notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; an existing release is never overwritten.' }
